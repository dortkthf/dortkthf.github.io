<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Privacy Policy</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; max-width: 760px;
         margin: 0 auto; padding: 24px 16px 64px; line-height: 1.7; color: #222; }
  h1 { font-size: 1.5em; margin-top: 1.6em; } h2 { font-size: 1.12em; margin-top: 1.8em; }
  .langbar { display: flex; justify-content: flex-end; }
  select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #bbb;
           background: #fff; color: inherit; }
  a { color: #0b62c4; }
  ul { padding-inline-start: 1.4em; }
  .pkg { color: #777; font-size: 0.88em; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #ddd; }
    select { background: #1c1c1c; color: #ddd; border-color: #444; }
    a { color: #6db3ff; }
    .pkg { color: #999; }
  }
</style>
</head>
<body>

<div class="langbar">
  <select id="lang" aria-label="Language"></select>
</div>
<main id="content"></main>

<script>
/**
 * One privacy policy for every app this developer publishes.
 *
 * Adding an app is one line in APPS below -- and it is an assertion, not just a listing: the
 * sections that follow say the app keeps its data on the device, has no account, and sends nothing
 * to a server of ours. An app that does not hold to that must not be added here; it needs its own
 * page, or these sections need rewriting in all 18 languages.
 */
const APPS = [
  { name: 'ONE MOVE', id: 'com.billionaire.onemove' },
];

const GP = 'https://policies.google.com/privacy';
const AM = 'https://support.google.com/admob/answer/6128543';
const MAIL = 'dortkthf@gmail.com';
const gp = (t) => `<a href="${GP}" rel="noopener">${t}</a>`;
const am = (t) => `<a href="${AM}" rel="noopener">${t}</a>`;
const mail = `<a href="mailto:${MAIL}">${MAIL}</a>`;
const list = `<ul>${APPS.map((a) => `<li>${a.name} <span class="pkg">(${a.id})</span></li>`).join('')}</ul>`;

/* Each locale: name (native, for the dropdown), dir, title, date, intro, s = [[heading, body], ...] */
const L = {

en: { name: 'English', title: 'Privacy Policy', date: 'Effective date: August 7, 2026',
  intro: 'This policy applies to every mobile app listed below. It explains what information those apps handle and how.',
  s: [
  ['1. Apps covered by this policy', `This policy applies to the following apps:${list}Apps released later are added to this list.`],
  ['2. Information the apps collect directly', 'The apps require no account or sign-in and do not directly collect personally identifiable information such as your name, email, or phone number. App data (progress, settings, items you have bought) is stored only on your device and is never sent to a server of ours.'],
  ['3. Advertising (Google AdMob)', `Apps that show ads do so through Google AdMob. To serve ads and prevent fraud, Google may collect your device's advertising ID, approximate location (IP-based), and device information. See the ${gp('Google Privacy Policy')} and ${am('how Google uses data in AdMob')}. You can reset your advertising ID or limit ad personalization in your device settings. Where an app offers a "Remove ads" purchase, buying it disables ads entirely.`],
  ['4. In-app purchases (Google Play)', `Apps that offer in-app purchases process them through Google Play Billing. They never access your payment details; they only receive confirmation that a purchase completed. Payment processing is governed by the ${gp('Google Privacy Policy')}.`],
  ['5. Children’s privacy', 'These apps are not directed primarily at children and do not knowingly collect personal information from children.'],
  ['6. Data deletion', 'All saved data lives on your device. Uninstalling an app or clearing its data in device settings removes it completely.'],
  ['7. Contact', `Privacy inquiries: ${mail}`],
  ['8. Changes', 'Any changes to this policy will be posted on this page.'] ] },

  s: [
  ['1. Applicazioni coperte da questa informativa', `Questa informativa si applica alle seguenti applicazioni:${list}Le applicazioni pubblicate in seguito verranno aggiunte a questo elenco.`],
  ['2. Informazioni raccolte direttamente dalle applicazioni', 'Le applicazioni non richiedono account né accesso e non raccolgono direttamente informazioni identificative come nome, e-mail o numero di telefono. I dati dell’applicazione (progressi, impostazioni, articoli acquistati) sono salvati solo sul tuo dispositivo e non vengono mai inviati a un nostro server.'],
  ['3. Pubblicità (Google AdMob)', `Le applicazioni che mostrano annunci lo fanno tramite Google AdMob. Per fornire gli annunci e prevenire le frodi, Google può raccogliere l’ID pubblicitario del dispositivo, la posizione approssimativa (basata sull’IP) e informazioni sul dispositivo. Consulta l’${gp('Informativa sulla privacy di Google')} e ${am('l’uso dei dati in AdMob')}. Puoi reimpostare l’ID pubblicitario o limitare la personalizzazione degli annunci nelle impostazioni del dispositivo. Quando un’applicazione offre l’acquisto "Rimuovi annunci", acquistarlo disattiva del tutto la pubblicità.`],
  ['4. Acquisti in-app (Google Play)', `Le applicazioni che offrono acquisti in-app li gestiscono tramite il sistema di fatturazione di Google Play. Non accedono mai ai tuoi dati di pagamento; ricevono solo la conferma dell’acquisto. Il trattamento dei pagamenti è regolato dall’${gp('Informativa sulla privacy di Google')}.`],
  ['5. Privacy dei minori', 'Queste applicazioni non sono rivolte principalmente ai bambini e non raccolgono consapevolmente i loro dati personali.'],
  ['6. Eliminazione dei dati', 'Tutti i dati salvati risiedono sul dispositivo. Disinstallando un’applicazione o cancellandone i dati dalle impostazioni del dispositivo vengono rimossi completamente.'],
  ['7. Contatti', `Domande sulla privacy: ${mail}`],
  ['8. Modifiche', 'Eventuali modifiche a questa informativa saranno pubblicate su questa pagina.'] ] },

ru: { name: 'Русский', title: 'Политика конфиденциальности', date: 'Дата вступления в силу: 7 августа 2026 г.',
  intro: 'Настоящая политика распространяется на все мобильные приложения, перечисленные ниже. В ней описано, какие данные эти приложения обрабатывают и как.',
  s: [
  ['1. Приложения, на которые распространяется политика', `Настоящая политика распространяется на следующие приложения:${list}Приложения, выпущенные позже, будут добавлены в этот список.`],
  ['2. Данные, которые приложения собирают напрямую', 'Приложения не требуют учётной записи и входа и не собирают напрямую персональные данные, такие как имя, электронная почта или номер телефона. Данные приложения (прогресс, настройки, купленные предметы) хранятся только на вашем устройстве и никогда не отправляются на наши серверы.'],
  ['3. Реклама (Google AdMob)', `Приложения, показывающие рекламу, делают это через Google AdMob. Для показа объявлений и защиты от мошенничества Google может собирать рекламный идентификатор устройства, приблизительное местоположение (по IP) и сведения об устройстве. См. ${gp('Политику конфиденциальности Google')} и ${am('использование данных в AdMob')}. Вы можете сбросить рекламный идентификатор или ограничить персонализацию рекламы в настройках устройства. Если приложение предлагает покупку «Убрать рекламу», она полностью отключает рекламу.`],
  ['4. Покупки в приложении (Google Play)', `Приложения с покупками обрабатывают их через платёжную систему Google Play. Они не имеют доступа к вашим платёжным данным и получают только подтверждение завершённой покупки. Обработка платежей регулируется ${gp('Политикой конфиденциальности Google')}.`],
  ['5. Конфиденциальность детей', 'Эти приложения не ориентированы в первую очередь на детей и сознательно не собирают их персональные данные.'],
  ['6. Удаление данных', 'Все сохранённые данные находятся на устройстве. Удаление приложения или очистка его данных в настройках устройства полностью их стирает.'],
  ['7. Контакты', `Вопросы о конфиденциальности: ${mail}`],
  ['8. Изменения', 'Изменения этой политики будут опубликованы на этой странице.'] ] },

pl: { name: 'Polski', title: 'Polityka prywatności', date: 'Data wejścia w życie: 7 sierpnia 2026 r.',
  intro: 'Niniejsza polityka dotyczy wszystkich aplikacji mobilnych wymienionych poniżej. Wyjaśnia, jakie informacje te aplikacje przetwarzają i w jaki sposób.',
  s: [
  ['1. Aplikacje objęte tą polityką', `Niniejsza polityka dotyczy następujących aplikacji:${list}Aplikacje wydane później zostaną dopisane do tej listy.`],
  ['2. Informacje zbierane bezpośrednio przez aplikacje', 'Aplikacje nie wymagają konta ani logowania i nie zbierają bezpośrednio danych osobowych, takich jak imię i nazwisko, e-mail czy numer telefonu. Dane aplikacji (postępy, ustawienia, zakupione elementy) są zapisywane wyłącznie na Twoim urządzeniu i nigdy nie są wysyłane na nasz serwer.'],
  ['3. Reklamy (Google AdMob)', `Aplikacje wyświetlające reklamy robią to za pośrednictwem Google AdMob. W celu wyświetlania reklam i zapobiegania oszustwom Google może zbierać identyfikator reklamowy urządzenia, przybliżoną lokalizację (na podstawie IP) oraz informacje o urządzeniu. Zobacz ${gp('Politykę prywatności Google')} oraz ${am('sposób wykorzystania danych w AdMob')}. Identyfikator reklamowy możesz zresetować, a personalizację reklam ograniczyć w ustawieniach urządzenia. Jeśli aplikacja oferuje zakup „Usuń reklamy", całkowicie wyłącza on reklamy.`],
  ['4. Zakupy w aplikacji (Google Play)', `Aplikacje oferujące zakupy w aplikacji obsługują je przez system płatności Google Play. Nigdy nie mają dostępu do Twoich danych płatniczych; otrzymują jedynie potwierdzenie zakupu. Przetwarzanie płatności podlega ${gp('Polityce prywatności Google')}.`],
  ['5. Prywatność dzieci', 'Te aplikacje nie są skierowane głównie do dzieci i świadomie nie zbierają ich danych osobowych.'],
  ['6. Usuwanie danych', 'Wszystkie zapisane dane znajdują się na urządzeniu. Odinstalowanie aplikacji lub wyczyszczenie jej danych w ustawieniach urządzenia usuwa je całkowicie.'],
  ['7. Kontakt', `Pytania dotyczące prywatności: ${mail}`],
  ['8. Zmiany', 'Wszelkie zmiany tej polityki zostaną opublikowane na tej stronie.'] ] },

tr: { name: 'Türkçe', title: 'Gizlilik Politikası', date: 'Yürürlük tarihi: 7 Ağustos 2026',
  intro: 'Bu politika, aşağıda listelenen tüm mobil uygulamalar için geçerlidir. Bu uygulamaların hangi bilgileri nasıl işlediğini açıklar.',
  s: [
  ['1. Bu politikanın kapsadığı uygulamalar', `Bu politika aşağıdaki uygulamalar için geçerlidir:${list}Daha sonra yayınlanan uygulamalar bu listeye eklenir.`],
  ['2. Uygulamaların doğrudan topladığı bilgiler', 'Uygulamalar hesap veya giriş gerektirmez; ad, e-posta veya telefon numarası gibi kişisel bilgileri doğrudan toplamaz. Uygulama verileri (ilerleme, ayarlar, satın alınan öğeler) yalnızca cihazınızda saklanır ve hiçbir zaman bize ait bir sunucuya gönderilmez.'],
  ['3. Reklamlar (Google AdMob)', `Reklam gösteren uygulamalar bunu Google AdMob üzerinden yapar. Reklam sunumu ve sahtekârlığı önleme amacıyla Google, cihazın reklam kimliğini, yaklaşık konumu (IP tabanlı) ve cihaz bilgilerini toplayabilir. Ayrıntılar için ${gp('Google Gizlilik Politikası’na')} ve ${am('AdMob’da veri kullanımına')} bakın. Cihaz ayarlarından reklam kimliğinizi sıfırlayabilir veya kişiselleştirilmiş reklamları sınırlayabilirsiniz. Bir uygulama "Reklamları kaldır" satın alma seçeneği sunuyorsa, satın alındığında reklamlar tamamen kapanır.`],
  ['4. Uygulama içi satın almalar (Google Play)', `Uygulama içi satın alma sunan uygulamalar bunları Google Play faturalandırması ile işler. Ödeme bilgilerinize asla erişmezler; yalnızca satın almanın tamamlandığı bilgisini alırlar. Ödeme işlemleri ${gp('Google Gizlilik Politikası’na')} tabidir.`],
  ['5. Çocukların gizliliği', 'Bu uygulamalar öncelikle çocuklara yönelik değildir ve çocuklardan bilerek kişisel bilgi toplamaz.'],
  ['6. Verilerin silinmesi', 'Tüm kayıtlı veriler cihazınızdadır. Uygulamayı kaldırmak veya cihaz ayarlarından uygulama verilerini temizlemek verileri tamamen siler.'],
  ['7. İletişim', `Gizlilikle ilgili sorular: ${mail}`],
  ['8. Değişiklikler', 'Bu politikadaki değişiklikler bu sayfada yayınlanır.'] ] },

ar: { name: 'العربية', dir: 'rtl', title: 'سياسة الخصوصية', date: 'تاريخ السريان: 7 أغسطس 2026',
  intro: 'تنطبق هذه السياسة على جميع التطبيقات المذكورة أدناه، وتوضح المعلومات التي تتعامل معها تلك التطبيقات وكيفية ذلك.',
  s: [
  ['1. التطبيقات التي تشملها هذه السياسة', `تنطبق هذه السياسة على التطبيقات التالية:${list}وتُضاف إلى هذه القائمة التطبيقات التي تصدر لاحقًا.`],
  ['2. المعلومات التي تجمعها التطبيقات مباشرة', 'لا تتطلب التطبيقات حسابًا أو تسجيل دخول، ولا تجمع مباشرة أي معلومات تعريف شخصية مثل الاسم أو البريد الإلكتروني أو رقم الهاتف. تُحفظ بيانات التطبيق (التقدم والإعدادات والعناصر المشتراة) على جهازك فقط ولا تُرسل أبدًا إلى خادم تابع لنا.'],
  ['3. الإعلانات (Google AdMob)', `تعرض التطبيقات التي تحتوي على إعلانات هذه الإعلانات عبر Google AdMob. لعرض الإعلانات ومنع الاحتيال، قد تجمع Google معرّف الإعلانات للجهاز والموقع التقريبي (استنادًا إلى عنوان IP) ومعلومات الجهاز. راجع ${gp('سياسة خصوصية Google')} و${am('كيفية استخدام البيانات في AdMob')}. يمكنك إعادة تعيين معرّف الإعلانات أو تقييد الإعلانات المخصصة من إعدادات الجهاز. وإذا كان التطبيق يوفّر عملية شراء «إزالة الإعلانات»، فإن شراءها يوقف الإعلانات نهائيًا.`],
  ['4. عمليات الشراء داخل التطبيق (Google Play)', `تعالج التطبيقات التي توفّر عمليات شراء داخلية هذه العمليات عبر نظام الدفع في Google Play. ولا تصل هذه التطبيقات أبدًا إلى بيانات الدفع الخاصة بك؛ بل تتلقى فقط تأكيد إتمام الشراء. تخضع معالجة المدفوعات ${gp('لسياسة خصوصية Google')}.`],
  ['5. خصوصية الأطفال', 'هذه التطبيقات ليست موجهة للأطفال في المقام الأول ولا تجمع عن قصد معلومات شخصية منهم.'],
  ['6. حذف البيانات', 'جميع البيانات المحفوظة موجودة على جهازك. يؤدي إلغاء تثبيت التطبيق أو مسح بياناته من إعدادات الجهاز إلى حذفها نهائيًا.'],
  ['7. التواصل', `للاستفسارات المتعلقة بالخصوصية: ${mail}`],
  ['8. التغييرات', 'سيتم نشر أي تغييرات على هذه السياسة في هذه الصفحة.'] ] },

hi: { name: 'हिन्दी', title: 'गोपनीयता नीति', date: 'प्रभावी तिथि: 7 अगस्त 2026',
  intro: 'यह नीति नीचे सूचीबद्ध सभी मोबाइल ऐप्स पर लागू होती है। यह बताती है कि वे ऐप्स कौन-सी जानकारी कैसे संभालते हैं।',
  s: [
  ['1. इस नीति के अंतर्गत आने वाले ऐप्स', `यह नीति निम्नलिखित ऐप्स पर लागू होती है:${list}बाद में जारी होने वाले ऐप्स इस सूची में जोड़े जाएँगे।`],
  ['2. ऐप्स द्वारा सीधे एकत्र की जाने वाली जानकारी', 'ऐप्स में खाता या लॉगिन की आवश्यकता नहीं है और वे नाम, ईमेल या फ़ोन नंबर जैसी व्यक्तिगत पहचान जानकारी सीधे एकत्र नहीं करते। ऐप का डेटा (प्रगति, सेटिंग, खरीदी गई वस्तुएँ) केवल आपके डिवाइस पर सहेजा जाता है और कभी हमारे सर्वर पर नहीं भेजा जाता।'],
  ['3. विज्ञापन (Google AdMob)', `विज्ञापन दिखाने वाले ऐप्स यह Google AdMob के माध्यम से करते हैं। विज्ञापन दिखाने और धोखाधड़ी रोकने के लिए Google डिवाइस की विज्ञापन ID, अनुमानित स्थान (IP-आधारित) और डिवाइस जानकारी एकत्र कर सकता है। ${gp('Google गोपनीयता नीति')} और ${am('AdMob में डेटा उपयोग')} देखें। आप डिवाइस सेटिंग में विज्ञापन ID रीसेट कर सकते हैं या वैयक्तिकृत विज्ञापन सीमित कर सकते हैं। जहाँ कोई ऐप "विज्ञापन हटाएँ" खरीद प्रदान करता है, उसे खरीदने पर विज्ञापन पूरी तरह बंद हो जाते हैं।`],
  ['4. इन-ऐप खरीदारी (Google Play)', `इन-ऐप खरीदारी देने वाले ऐप्स उसे Google Play बिलिंग से संसाधित करते हैं। वे आपके भुगतान विवरण तक कभी नहीं पहुँचते; उन्हें केवल खरीद पूरी होने की पुष्टि मिलती है। भुगतान प्रोसेसिंग ${gp('Google गोपनीयता नीति')} के अधीन है।`],
  ['5. बच्चों की गोपनीयता', 'ये ऐप्स मुख्य रूप से बच्चों के लिए नहीं हैं और जानबूझकर बच्चों की व्यक्तिगत जानकारी एकत्र नहीं करते।'],
  ['6. डेटा हटाना', 'सभी सहेजा गया डेटा आपके डिवाइस पर है। ऐप अनइंस्टॉल करने या डिवाइस सेटिंग में ऐप डेटा साफ़ करने से यह पूरी तरह हट जाता है।'],
  ['7. संपर्क', `गोपनीयता संबंधी प्रश्न: ${mail}`],
  ['8. परिवर्तन', 'इस नीति में कोई भी बदलाव इसी पृष्ठ पर प्रकाशित किया जाएगा।'] ] },

id: { name: 'Bahasa Indonesia', title: 'Kebijakan Privasi', date: 'Tanggal berlaku: 7 Agustus 2026',
  intro: 'Kebijakan ini berlaku untuk semua aplikasi seluler yang tercantum di bawah ini. Kebijakan ini menjelaskan informasi apa yang ditangani aplikasi tersebut dan bagaimana caranya.',
  s: [
  ['1. Aplikasi yang dicakup kebijakan ini', `Kebijakan ini berlaku untuk aplikasi berikut:${list}Aplikasi yang dirilis kemudian akan ditambahkan ke daftar ini.`],
  ['2. Informasi yang dikumpulkan langsung oleh aplikasi', 'Aplikasi tidak memerlukan akun atau login dan tidak mengumpulkan langsung informasi identitas pribadi seperti nama, email, atau nomor telepon. Data aplikasi (progres, pengaturan, item yang dibeli) hanya disimpan di perangkat Anda dan tidak pernah dikirim ke server kami.'],
  ['3. Iklan (Google AdMob)', `Aplikasi yang menampilkan iklan melakukannya melalui Google AdMob. Untuk menayangkan iklan dan mencegah penipuan, Google dapat mengumpulkan ID iklan perangkat, lokasi perkiraan (berbasis IP), dan informasi perangkat. Lihat ${gp('Kebijakan Privasi Google')} dan ${am('penggunaan data di AdMob')}. Anda dapat menyetel ulang ID iklan atau membatasi personalisasi iklan di pengaturan perangkat. Jika sebuah aplikasi menawarkan pembelian "Hapus iklan", membelinya akan menonaktifkan iklan sepenuhnya.`],
  ['4. Pembelian dalam aplikasi (Google Play)', `Aplikasi yang menawarkan pembelian dalam aplikasi memprosesnya melalui Google Play Billing. Aplikasi tidak pernah mengakses detail pembayaran Anda; hanya menerima konfirmasi bahwa pembelian selesai. Pemrosesan pembayaran diatur oleh ${gp('Kebijakan Privasi Google')}.`],
  ['5. Privasi anak', 'Aplikasi ini tidak ditujukan terutama untuk anak-anak dan tidak dengan sengaja mengumpulkan informasi pribadi anak.'],
  ['6. Penghapusan data', 'Semua data tersimpan berada di perangkat Anda. Menghapus aplikasi atau membersihkan datanya di pengaturan perangkat akan menghapusnya sepenuhnya.'],
  ['7. Kontak', `Pertanyaan privasi: ${mail}`],
  ['8. Perubahan', 'Setiap perubahan kebijakan ini akan diumumkan di halaman ini.'] ] },

th: { name: 'ไทย', title: 'นโยบายความเป็นส่วนตัว', date: 'วันที่มีผลบังคับใช้: 7 สิงหาคม 2026',
  intro: 'นโยบายนี้ใช้กับแอปบนมือถือทุกแอปที่ระบุไว้ด้านล่าง และอธิบายว่าแอปเหล่านั้นจัดการข้อมูลใดและอย่างไร',
  s: [
  ['1. แอปที่อยู่ภายใต้นโยบายนี้', `นโยบายนี้ใช้กับแอปต่อไปนี้:${list}แอปที่เปิดตัวในภายหลังจะถูกเพิ่มลงในรายการนี้`],
  ['2. ข้อมูลที่แอปเก็บโดยตรง', 'แอปไม่ต้องสมัครสมาชิกหรือเข้าสู่ระบบ และไม่เก็บข้อมูลระบุตัวตน เช่น ชื่อ อีเมล หรือหมายเลขโทรศัพท์โดยตรง ข้อมูลของแอป (ความคืบหน้า การตั้งค่า รายการที่ซื้อ) จะบันทึกไว้ในอุปกรณ์ของคุณเท่านั้น และไม่ถูกส่งไปยังเซิร์ฟเวอร์ของเรา'],

const sel = document.getElementById('lang');
for (const [code, loc] of Object.entries(L)) {
  const o = document.createElement('option');
  o.value = code; o.textContent = loc.name;
  sel.appendChild(o);
}

function render(code) {
  const loc = L[code] || L.en;
  document.documentElement.lang = code;
  document.documentElement.dir = loc.dir || 'ltr';
  document.title = loc.title;
  document.getElementById('content').innerHTML =
    `<h1>${loc.title}</h1><p>${loc.date}</p><p>${loc.intro}</p>` +
    loc.s.map(([h, b]) => `<h2>${h}</h2><p>${b}</p>`).join('');
  try { localStorage.setItem('privacy.lang', code); } catch {}
}

sel.addEventListener('change', () => render(sel.value));

/**
 * Default English; a ?lang= in the URL wins, so a store listing can link straight to the language
 * its readers use. A previously chosen language is remembered after that.
 */
let start = 'en';
try { const saved = localStorage.getItem('privacy.lang'); if (saved && L[saved]) start = saved; } catch {}
const asked = new URLSearchParams(location.search).get('lang');
if (asked && L[asked]) start = asked;
sel.value = start;
render(start);
</script>
