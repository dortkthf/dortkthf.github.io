<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mind Way Privacy Policy</title>
<link rel="stylesheet" href="../privacy.css" />
</head>
<body>

<div class="langbar">
  <select id="lang" aria-label="Language"></select>
</div>
<main id="content"></main>

<!--
  Per-app configuration. `ads` and `iap` stay true for the same reason they do in ONE MOVE: the
  AdMob SDK and the Play Billing library are both still bundled in the app. The banner is switched
  off in the current build (MonetizationProvider.enabled == false) and the "remove ads" product is
  not live yet, but the switch is meant to be flipped back, and under-disclosing is the worse of the
  two mistakes -- a policy that promises less than the binary can do is the one that gets flagged.
-->
<script>
  window.APP = { name: 'Mind Way', id: 'com.mindway.app', ads: true, iap: true };
</script>
<script src="../privacy.js"></script>

</body>
</html>
