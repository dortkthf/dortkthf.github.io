    고쳐야 한다. 최소한 다음이 들어가야 한다:

        보지 않는다는 사실
    형제 앱의 privacy.html 에 그 문단들이 그대로 있으니 가져다 쓰면 된다.

  언어는 앱이 지원하는 10 개와 같게 맞췄다.
*/

  ['3. เครือข่ายและสิทธิ์', 'แอปไม่มีการสื่อสารผ่านเครือข่าย ไม่มีเครื่องมือวิเคราะห์และไม่มีโฆษณา และไม่ขอสิทธิ์ใด ๆ นอกจากการเปิดหน้าจอค้างไว้ขณะเล่นเสียง'],
  ['4. ความเป็นส่วนตัวของเด็ก', 'แอปไม่ได้มุ่งเป้าไปที่เด็กเป็นหลัก และไม่เก็บข้อมูลส่วนบุคคลจากเด็กโดยเจตนา'],
  ['5. การลบข้อมูล', 'ข้อมูลที่บันทึกไว้ทั้งหมดอยู่บนอุปกรณ์ของคุณ การถอนการติดตั้งแอปหรือล้างข้อมูลแอปในการตั้งค่าอุปกรณ์จะลบข้อมูลออกอย่างสมบูรณ์และถาวร ไม่มีสิ่งใดที่ต้องลบในฝั่งของเรา'],
  ['6. ติดต่อ', `สอบถามเรื่องความเป็นส่วนตัว: ${mail}`],
  ['7. การเปลี่ยนแปลง', 'การเปลี่ยนแปลงใด ๆ ของนโยบายนี้จะประกาศบนหน้านี้พร้อมวันที่มีผลบังคับใช้ใหม่'] ] },

};

const sel = document.getElementById('lang');
for (const [code, loc] of Object.entries(L)) {
  const o = document.createElement('option');
  o.value = code; o.textContent = loc.name;
  sel.appendChild(o);
}

function render(code) {
  const loc = L[code] || L.en;
  document.documentElement.lang = code;
  document.documentElement.dir = loc.dir || 'ltr';
  document.title = loc.title;
  document.getElementById('content').innerHTML =
    `<h1>${loc.title}</h1><p>${loc.date}</p><p>${loc.intro}</p>` +
    loc.s.map(([h, b]) => `<h2>${h}</h2><p>${b}</p>`).join('');
  try { localStorage.setItem('mindway.privacy.lang', code); } catch {}
}

sel.addEventListener('change', () => render(sel.value));

/* 기본은 영어. 방문자가 전에 고른 언어가 있으면 그것으로 시작한다. */
let start = 'en';
try { const saved = localStorage.getItem('mindway.privacy.lang'); if (saved && L[saved]) start = saved; } catch {}
sel.value = start;
render(start);
</script>
